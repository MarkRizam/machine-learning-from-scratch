[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rizam-ml-from-scratch"
version = "0.1.0"
description = "AIR-001: educational NumPy machine learning reproductions"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[project.optional-dependencies]
research = ["scikit-learn==1.8.0", "scipy==1.17.0", "matplotlib==3.10.8", "pytest==9.0.2", "nbformat==5.10.4", "nbclient==0.10.4", "ipykernel==7.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
