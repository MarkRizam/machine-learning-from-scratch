name: AIR-001 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verification:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[research]'
      - run: python -m pytest -q
      - run: python -m ml_from_scratch.experiments
      - run: python scripts/execute_notebooks.py
